spring:
  main:
    web-application-type: none
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/jingda?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Tokyo}
    username: ${DB_USERNAME:app_user}
    password: ${DB_PASSWORD:app_password}
    driver-class-name: com.mysql.cj.jdbc.Driver

app:
  batch:
    code: ${BATCH_CODE:credit-card-repayment}
    target-date: ${TARGET_DATE:}
    zone: ${BATCH_ZONE:Asia/Tokyo}
