spring:
  main:
    web-application-type: none
  datasource:
    url: ${DB_URL:jdbc:mysql://115.190.57.247:3306/jingda?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Tokyo}
    username: ${DB_USERNAME:app_user}
    password: ${DB_PASSWORD:app_password}
