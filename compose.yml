services:
  oracle:
    image: gvenzl/oracle-free:23-slim-faststart
    container_name: employee-oracle
    ports:
      - "1521:1521"
    environment:
      ORACLE_PASSWORD: ${ORACLE_PASSWORD:-oracle_password}
      APP_USER: ${DB_USERNAME:-app_user}
      APP_USER_PASSWORD: ${DB_PASSWORD:-app_password}
    volumes:
      - oracle-data:/opt/oracle/oradata
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s

volumes:
  oracle-data:
